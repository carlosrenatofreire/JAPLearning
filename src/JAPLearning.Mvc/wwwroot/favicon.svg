<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Fundo redondo -->
  <rect width="32" height="32" rx="8" fill="#E8501A"/>
  <!-- Chapéu de estudante (mortarboard) -->
  <!-- Topo do chapéu (losango) -->
  <polygon points="16,6 28,12 16,18 4,12" fill="#ffffff"/>
  <!-- Aba quadrada do chapéu -->
  <rect x="10" y="17" width="12" height="2" rx="1" fill="#ffffff"/>
  <!-- Corpo do chapéu (cilindro) -->
  <rect x="12" y="19" width="8" height="5" rx="1" fill="#ffffff"/>
  <!-- Cordão do chapéu -->
  <line x1="28" y1="12" x2="28" y2="18" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="28" cy="19" r="1.5" fill="#ffffff"/>
</svg>
